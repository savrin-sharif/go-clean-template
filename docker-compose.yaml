services:
  api:
    build: .
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      APP_NAME: ${APP_NAME:-Go Clean Template}
      APP_ENV: ${APP_ENV:-local}
      HTTP_PORT: "8080"
      HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # Uncomment to wire the optional Postgres welcome repository:
      # DATABASE_URL: postgres://postgres:postgres@db:5432/app_db?sslmode=disable
    # depends_on:
