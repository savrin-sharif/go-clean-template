<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.AppName}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #0c1210;
      --bg-1: #15201b;
      --ink: #e8f0eb;
      --muted: #8fa399;
      --accent: #3dd68c;
      --line: rgba(232, 240, 235, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 12% -10%, rgba(61, 214, 140, 0.18), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(56, 120, 96, 0.22), transparent 50%),
        linear-gradient(160deg, var(--bg-0), var(--bg-1) 55%, #0a100e);
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      width: min(40rem, 100%);
      animation: rise 0.7s ease-out both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .env {
      display: inline-block;
      margin-bottom: 1.25rem;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.35rem;
      animation: rise 0.7s ease-out 0.08s both;
    }

    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: clamp(2.4rem, 7vw, 3.6rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 0.85rem;
    }

    p {
      max-width: 32rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
      margin-bottom: 2rem;
      animation: rise 0.7s ease-out 0.16s both;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      animation: rise 0.7s ease-out 0.24s both;
    }

    a {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 500;
      font-size: 0.95rem;
      text-decoration: none;
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 0.7rem 1.1rem;
      transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
    }

    a.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #062016;
    }

    a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    a.primary:hover {
      background: #62e3a5;
      border-color: #62e3a5;
      color: #062016;
    }
  </style>
</head>
<body>
  <main>
    <div class="env">{{.Environment}}</div>
    <h1>{{.AppName}}</h1>
    <p>Clean-architecture REST API. Explore interactive docs or hit the live JSON endpoints.</p>
    <div class="actions">
      <a class="primary" href="/docs">Open API docs</a>
      <a href="/health">/health</a>
      <a href="/api/v1/welcome">/api/v1/welcome</a>
      <a href="/openapi.yaml">openapi.yaml</a>
    </div>
  </main>
</body>
</html>
